# dev-agent PR 评审闭环（P0-3，round-113）——GitHub Action 模式（不自建 App）。
# 触发：PR 打开/更新，或评论 /review。评审走 runner.py 0-10 步编排；
# 行内评论经 pr-kit 交付包 + github-poster 发布（token 只走环境变量）。
# 本文件为接入模板：仓库需在 GitHub 上启用 Actions 后按需调整依赖清单。
name: dev-agent 评审

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      github.event_name == 'pull_request' ||
      startsWith(github.event.comment.body, '/review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (SHA-pinned, r146)
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (SHA-pinned, r146)
        with:
          python-version: "3.12"
      - name: 安装引擎依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff>=0.8" "ast-grep-py>=0.4"
      - name: 取变更范围
        env:
          # 同上：base_ref/sha 经 env 中转，run 内不直接插值 github.*。
          BASE_REF: ${{ github.base_ref }}
          SHA: ${{ github.sha }}
        run: >-
          echo "REVIEW_RANGE=origin/${BASE_REF}...${SHA}"
          >> "$GITHUB_ENV"
      - name: 编排评审（0-10 步）
        env:
          # 事件上下文一律经 env 中转（官方修法），run 内禁止直接插值
          # ${{ github.event.* }}，防标题/评论正文注入 shell。
          REQUEST: ${{ github.event.pull_request.title || github.event.comment.body }}
        run: |
          python skills/orchestrator/scripts/runner.py \
            --repo . --range "$REVIEW_RANGE" \
            --request "$REQUEST" \
            > runs-result.json
      - name: 生成 PR 交付包
        run: >-
          python skills/orchestrator/scripts/pr-kit.py
          --result runs-result.json --out pr-kit-out
      - name: 发布行内评论
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 同上：PR 号与仓库名经 env 中转，run 内不直接插值 github.*。
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: >-
          python skills/orchestrator/scripts/github-poster.py
          --repo "$REPO"
          --pr "$PR_NUMBER"
          --comments pr-kit-out/review-comments.json

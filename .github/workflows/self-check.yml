name: self-check

# r146 OpenSSF Token-Permissions：显式最小权限（默认继承的写权限全部收回）
permissions:
  contents: read

on:
  push:
  pull_request:
  schedule:
    # nightly 全量对账（D-049 A：CI/PR 跑 smoke，发布闸与 nightly 跑 full）
    - cron: "0 19 * * *"

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    # 单次作业上限：测试全量本地约 290 秒，CI 冷启动 + 依赖安装留足余量；
    # 卡死时快速失败，不占满 6 小时默认额度（2026-10-28 行业对标后硬化）。
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.12 是本地 .venv 的实际版本；此前矩阵缺这一档（CI 绿色不代表
        # 开发环境可用）。
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (SHA-pinned, r146)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (SHA-pinned, r146)
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装引擎依赖（锁安装，round-139 供应链锁定）
        # 此前 CI 不装依赖：agent/engines 测试在缺 tree-sitter 的环境里
        # 直接报错或静默跳过，绿灯不含引擎层证据（2026-10-28 审查发现）。
        # round-139 改哈希锁定安装：requirements-lock.txt 由 uv.lock 导出
        # （uv export --format requirements.txt --no-emit-project --extra dev），
        # 含全部 20+ 依赖与 sha256；此前裸 pip 清单缺 tree-sitter-typescript/go
        # 两项（与 pyproject 声明漂移），锁文件一并修复。
        # pytest 注意：锁钉 8.4.2（isolated extra 全图解析回压），venv 实跑
        # 9.2.0——套件两版本均全绿（r110 迁移验证），差异如实记录。
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-lock.txt
      - name: 契约断言（smoke 清单，D-049 A：CI/PR 口径）
        if: github.event_name != 'schedule'
        run: |
          python -c "import sys, json, unittest; sys.path.insert(0, 'tests'); names=json.load(open('tests/smoke-manifest.json', encoding='utf-8'))['tests']; suite=unittest.defaultTestLoader.loadTestsFromNames(names); r=unittest.TextTestRunner(verbosity=0).run(suite); raise SystemExit(0 if r.wasSuccessful() else 1)"
      - name: 契约断言（全量，nightly 口径；D-051 批 A：xdist 2 worker，r109 本地双验证 301s/269s 全绿）
        if: github.event_name == 'schedule' && matrix.os == 'ubuntu-latest'
        run: timeout 600 python -m pytest tests -n 2 -q
      - name: Full suite (nightly, windows-latest)
        # Windows 无 GNU timeout；D-052 精修（round-139）：python subprocess
        # 600s 包装补齐 windows 侧挂死护栏，超时 exit 124 判红（此前只有
        # job-level timeout-minutes(45) 兜底，600s 判红语义缺失）。
        if: github.event_name == 'schedule' && matrix.os == 'windows-latest'
        run: |
          python -c 'import subprocess, sys
          try:
              rc = subprocess.run([sys.executable, "-m", "pytest", "tests", "-n", "2", "-q"], timeout=600).returncode
          except subprocess.TimeoutExpired:
              sys.exit(124)
          sys.exit(rc)'
      - name: 开局探针（文档漂移/反向验证/死代码）
        run: python skills/self-iteration/scripts/session-probe.py --root .
      - name: 死代码扫描
        run: python skills/self-iteration/scripts/dead-code-scan.py --root .
      - name: 文档新鲜度对账（计数/版本 vs 真值）
        run: python skills/self-iteration/scripts/doc-freshness.py --root .
      - name: 文档与脚本结构判据（元信息/链接/锚点/表格/登记/占位符 + 脚本 UTF-8 stdout；r165/r219 接线）
        run: python skills/self-iteration/scripts/doc-structure.py --root .
      - name: 发布闸版本同步（分项对账；全量签核见 release-gate.py）
        run: python skills/self-iteration/scripts/release-gate.py --root . --only version_sync
      - name: Skill 触发词覆盖度体检
        run: python skills/self-iteration/scripts/trigger-audit.py --skills-root skills --probes skills/self-iteration/probes.json --self-check --cross
      - name: 覆盖率基线对账（仅 windows-latest × 3.12，基线平台对齐）
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.12'
        run: python skills/self-iteration/scripts/coverage-gate.py check --root .
      - name: 凭据形态扫描
        run: python skills/self-iteration/scripts/secret-scan.py --root .
      - name: 依赖许可证清单校验
        run: python skills/self-iteration/scripts/license-check.py --root .
      - name: 合成语料精度
        run: |
          python skills/eval-harness/scripts/forward-bench.py synth --out corpus/ --count 60
          python skills/eval-harness/scripts/forward-bench.py fp --corpus corpus/
      - name: 项目指纹
        run: python skills/eval-harness/scripts/fingerprint.py --root .
      - name: CVE 扫描（pip-audit，nightly 每次；r148 Scorecard Vulnerability-Scan 整改）
        # 扫描器钉小版本（非 hash 锁——扫描器独立于被测依赖面，权衡如实记录）；
        # 发现已知 CVE 即非零退出，nightly 红。本地等价：.venv/Scripts/pip-audit.exe -l
        run: |
          python -m pip install "pip-audit==2.10.1"
          python -m pip_audit --desc
      - name: scan 延迟 SLO 门禁（r155：run+check 全链，p95 逐档断言）
        # latency-bench run（三档实跑基准）→ check 对 latency-slo.json 逐档
        # 断言 p95 ≤ p95_max_s；任一档超限 rc=1 nightly 红。反向验证样例入
        # 契约（test_check_fail_rc1 造超限报告确认抓住）；阈值只抓量级回归
        # （阈值 ~10x 余量，实测 0.12s 级），不抓机器噪声。
        run: |
          python skills/self-iteration/scripts/latency-bench.py run --rules skills/multi-agent-review/scripts/deterministic-rules.py --out reports/_work/latency-ci.json
          python skills/self-iteration/scripts/latency-bench.py check --report reports/_work/latency-ci.json
      - name: PII 自检（反向样例规则引擎自证，r234 批次二 M7）
        run: python skills/production-guardrails/scripts/pii-scan.py selftest
      - name: MCP 自扫描（tools pin/policy 哈希固化对账，r233 批次一 M1/M4）
        # TOOLS 16 工具名/描述/Schema + tools-policy.json 的 sha256 与
        # mcp/tools-pin.json 对账；漂移即红（清单演进须与 pin 同 commit）。
        run: python skills/production-guardrails/scripts/mcp-selfscan.py --root . check
      - name: MCP 工具面投毒扫描（mcp-scan，nightly 每次；r196 AB-08，复用 Invariant mcp-scan v2.3.0）
        # 生成指向本仓 MCP 服务器的标准 .mcp.json（治理壳 stdlib 可直接运行），
        # mcp-scan 动态枚举 16 工具并扫描描述投毒/阴影动作；critical/high 即
        # nightly 红。注意：mcp-scan 2.3.0 在本地 Windows 无法动态枚举（spawn
        # 限制，静态配置检查正常，r196 实测）——动态枚举以 CI ubuntu 为准；
        # 首次 CI 报告将落 reports/mcp-scan/baseline.json 供后续 diff 对账
        # （第 157 条跟进项）。工具描述=提示注入面（AB-09 规范见
        # docs/06-operations/使用说明与配置.md §MCP 工具描述规范）。
        run: |
          python -c "import json; json.dump({'mcpServers': {'code-review': {'command': 'python', 'args': ['mcp/review_mcp.py'], 'env': {'PYTHONIOENCODING': 'utf-8'}}}}, open('.mcp.json', 'w'))"
          npx -y mcp-scan@2.3.0 scan --json > reports/_work/mcp-scan-nightly.json || true
          python -c "import json, sys; d = json.load(open('reports/_work/mcp-scan-nightly.json')); crit = d.get('criticalCount', 0); high = d.get('highCount', 0); print('mcp-scan: critical=%d high=%d totalScanned=%d' % (crit, high, d.get('totalScanned', 0))); sys.exit(1) if (crit or high) else None"
          rm -f .mcp.json
